name: Build UNO Party Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android platform wrapper exists
        run: flutter create . --platforms=android --org com.unoparty.game --project-name uno_party

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test --reporter expanded | tee test-report.txt

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK (unsigned or configured keystore)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
            flutter build apk --release
          else
            flutter build apk --release
          fi

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uno-party-test-report
          path: test-report.txt

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-party-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-party-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
